<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" role="img"><title>本课论证链：指标与图形 → 两类策略 → 困境反转与三招 → 时间框架与纪律</title><defs><marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#636c66"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#244e3d"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#974c35"/></marker><marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a4775"/></marker></defs><rect x="20" y="20" width="560" height="100" rx="12" fill="#e6efe8"/><text x="44" y="60" font-size="18" fill="#636c66" text-anchor="start">§1–6</text><text x="130" y="60" font-size="24" fill="#244e3d" text-anchor="start" font-weight="700">指标与图形</text><text x="44" y="98" font-size="20" fill="#242b29" text-anchor="start">基本面定「做什么」，少数指标定「何时」</text><path d="M300 122 L300 151" stroke="#636c66" stroke-width="3" fill="none" marker-end="url(#m)"/><rect x="20" y="155" width="560" height="100" rx="12" fill="#e6efe8"/><text x="44" y="195" font-size="18" fill="#636c66" text-anchor="start">§7–11</text><text x="130" y="195" font-size="24" fill="#244e3d" text-anchor="start" font-weight="700">两类策略</text><text x="44" y="233" font-size="20" fill="#242b29" text-anchor="start">趋势跟随要快 · 均值回归要准</text><path d="M300 257 L300 286" stroke="#636c66" stroke-width="3" fill="none" marker-end="url(#m)"/><rect x="20" y="290" width="560" height="100" rx="12" fill="#f6e8e1"/><text x="44" y="330" font-size="18" fill="#636c66" text-anchor="start">§12–14</text><text x="130" y="330" font-size="24" fill="#974c35" text-anchor="start" font-weight="700">困境反转与三招</text><text x="44" y="368" font-size="20" fill="#242b29" text-anchor="start">仓位错位 · 萌芽趋势 · 历史极值＋催化剂</text><path d="M300 392 L300 421" stroke="#636c66" stroke-width="3" fill="none" marker-end="url(#m)"/><rect x="20" y="425" width="560" height="100" rx="12" fill="#f6e8e1"/><text x="44" y="465" font-size="18" fill="#636c66" text-anchor="start">§15–20</text><text x="130" y="465" font-size="24" fill="#974c35" text-anchor="start" font-weight="700">时间框架与纪律</text><text x="44" y="503" font-size="20" fill="#242b29" text-anchor="start">先定拿多久，再用仓位隔离承接</text></svg>
