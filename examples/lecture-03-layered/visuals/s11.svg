<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" role="img"><title>均值回归的陷阱是接飞刀：不要沿亏损仓位不断补仓；讲师在NVO上先抄、次日止损、再跌后重新入场</title><defs><marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#636c66"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#244e3d"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#974c35"/></marker><marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a4775"/></marker></defs><text x="150" y="32" font-size="22" fill="#974c35" text-anchor="middle" font-weight="700">✗ 接飞刀</text><text x="450" y="32" font-size="20" fill="#244e3d" text-anchor="middle" font-weight="700">讲师的做法（NVO 案例）</text><path d="M30 70 L70 110 L100 150 L130 190 L160 230 L190 270" stroke="#974c35" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="70" cy="110" r="7" fill="#f6e8e1" stroke="#974c35" stroke-width="2"/><circle cx="130" cy="190" r="11" fill="#f6e8e1" stroke="#974c35" stroke-width="2"/><circle cx="190" cy="270" r="15" fill="#f6e8e1" stroke="#974c35" stroke-width="2"/><text x="205" y="150" font-size="17" fill="#974c35" text-anchor="start" font-weight="700">不断补仓</text><text x="205" y="176" font-size="15" fill="#242b29" text-anchor="start">仓位越来越大</text><path d="M330 70 L380 120 L420 160 L470 210 L520 190 L570 150" stroke="#636c66" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="380" cy="120" r="8" fill="#244e3d"/><circle cx="420" cy="160" r="8" fill="#974c35"/><circle cx="470" cy="210" r="8" fill="#244e3d"/><text x="330" y="252" font-size="15" fill="#242b29" text-anchor="start">① 财报后大跌约20%，抄一下</text><text x="330" y="278" font-size="15" fill="#974c35" text-anchor="start">② 第二天又跌，立刻止损</text><text x="330" y="304" font-size="15" fill="#244e3d" text-anchor="start">③ 第三天再跌后重新入场</text><text x="20" y="316" font-size="15" fill="#636c66" text-anchor="start">跌得多 ≠ 底部已到；可能有永久损失</text></svg>
