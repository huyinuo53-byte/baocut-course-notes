<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" role="img"><title>三招：仓位导致的价格错位（均值回归）、萌芽趋势及时跟随、历史极值区提前布局并等催化剂</title><defs><marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#636c66"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#244e3d"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#974c35"/></marker><marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a4775"/></marker></defs><rect x="20" y="18" width="560" height="90" rx="12" fill="#f6e8e1"/><text x="44" y="72" font-size="20" fill="#974c35" text-anchor="start" font-weight="700">第一招</text><text x="140" y="58" font-size="21" fill="#242b29" text-anchor="start" font-weight="700">仓位导致的价格错位</text><text x="140" y="90" font-size="17" fill="#636c66" text-anchor="start">均值回归 · 例 PG</text><rect x="20" y="122" width="560" height="90" rx="12" fill="#e6efe8"/><text x="44" y="176" font-size="20" fill="#244e3d" text-anchor="start" font-weight="700">第二招</text><text x="140" y="162" font-size="21" fill="#242b29" text-anchor="start" font-weight="700">右侧趋势刚萌芽就跟随</text><text x="140" y="194" font-size="17" fill="#636c66" text-anchor="start">趋势跟随 · 例 SMH</text><rect x="20" y="226" width="560" height="90" rx="12" fill="#f6e8e1"/><text x="44" y="280" font-size="20" fill="#974c35" text-anchor="start" font-weight="700">第三招</text><text x="140" y="266" font-size="21" fill="#242b29" text-anchor="start" font-weight="700">多年历史极值区提前布局</text><text x="140" y="298" font-size="17" fill="#636c66" text-anchor="start">均值回归偏左侧 · 等催化剂</text><text x="300" y="366" font-size="16" fill="#242b29" text-anchor="middle" font-weight="700">共同点：先说明价格为何会变，再选顺势或逆向入场</text></svg>
