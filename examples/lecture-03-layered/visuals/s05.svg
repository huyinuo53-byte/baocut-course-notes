4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="580" y="32" font-size="14" fill="#636c66" text-anchor="end">示意，非原图数据</text><path d="M150 60 V300" stroke="#974c35" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/><path d="M430 60 V300" stroke="#244e3d" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/><path d="M152 290 H428" stroke="#636c66" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="290" y="284" font-size="16" fill="#636c66" text-anchor="middle">高位运行约一个多月</text><rect x="20" y="304" width="270" height="66" rx="12" fill="#f6e8e1"/><text x="155.0" y="332.235" font-size="17" fill="#974c35" text-anchor="middle" font-weight="700">刚碰 3σ 就逆向做空</text><text x="155.0" y="354.15500000000003" font-size="16" fill="#242b29" text-anchor="middle">可能过早：还会高位盘整</text><rect x="310" y="304" width="270" height="66" rx="12" fill="#e6efe8"/><text x="445.0" y="332.235" font-size="17" fill="#244e3d" text-anchor="middle" font-weight="700">停留约一个月后再逆向</text><text x="445.0" y="354.15500000000003" font-size="16" fill="#242b29" text-anchor="middle">讲师认为胜率相对较高</text></svg>
