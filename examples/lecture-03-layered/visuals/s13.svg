<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" role="img"><title>困境反转三道筛选：股价自高点跌一半以上、长期估值低位、具体催化剂，三者齐备才进入</title><defs><marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#636c66"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#244e3d"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#974c35"/></marker><marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a4775"/></marker></defs><rect x="20.0" y="18" width="560" height="62" rx="12" fill="#f6e8e1"/><text x="300.0" y="56.1" font-size="20" fill="#974c35" text-anchor="middle" font-weight="700">① 股价自 52 周高点跌 ≥ 50%</text><rect x="65.0" y="94" width="470" height="62" rx="12" fill="#f0eee5"/><text x="300.0" y="132.1" font-size="20" fill="#242b29" text-anchor="middle" font-weight="700">② 长期估值处于历史低位</text><rect x="110.0" y="170" width="380" height="62" rx="12" fill="#e6efe8"/><text x="300.0" y="208.1" font-size="20" fill="#244e3d" text-anchor="middle" font-weight="700">③ 有具体的催化剂</text><path d="M300 248 L300 270" stroke="#244e3d" stroke-width="3" fill="none" marker-end="url(#g)"/><rect x="200" y="274" width="200" height="50" rx="12" fill="#244e3d"/><text x="300.0" y="305.745" font-size="19" fill="#fffdf8" text-anchor="middle" font-weight="700">三者齐备才进入</text><text x="20" y="352" font-size="16" fill="#242b29" text-anchor="start">催化剂例：NVO 口服减重药 · FISV 激进投资人入场</text><text x="20" y="380" font-size="16" fill="#974c35" text-anchor="start">找不到催化剂（如 PAPER/PEOPLE，代码未确认）→ 放弃</text></svg>
