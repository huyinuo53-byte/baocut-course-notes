<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" role="img"><title>龙头相对方向定义：做多选最强，做空选最弱的领跌者，如当时航空股中的AAL</title><defs><marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#636c66"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#244e3d"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#974c35"/></marker><marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a4775"/></marker></defs><rect x="20" y="20" width="270" height="110" rx="12" fill="#e6efe8"/><text x="155.0" y="70.695" font-size="24" fill="#244e3d" text-anchor="middle" font-weight="700">做多</text><text x="155.0" y="97.94500000000001" font-size="19" fill="#242b29" text-anchor="middle">选该方向最强的</text><rect x="310" y="20" width="270" height="110" rx="12" fill="#f6e8e1"/><text x="445.0" y="70.695" font-size="24" fill="#974c35" text-anchor="middle" font-weight="700">做空</text><text x="445.0" y="97.94500000000001" font-size="19" fill="#242b29" text-anchor="middle">选最弱的「领跌者」</text><text x="310" y="166" font-size="17" fill="#636c66" text-anchor="start">航空例：</text><rect x="390" y="146" width="56" height="34" rx="6" fill="#f6e8e1"/><text x="418" y="170" font-size="16" fill="#974c35" text-anchor="middle" font-weight="700">AAL</text><rect x="454" y="146" width="56" height="34" rx="6" fill="#f0eee5"/><text x="482" y="170" font-size="16" fill="#636c66" text-anchor="middle">UAL</text><rect x="518" y="146" width="56" height="34" rx="6" fill="#f0eee5"/><text x="546" y="170" font-size="16" fill="#636c66" text-anchor="middle">DAL</text><text x="390" y="204" font-size="16" fill="#974c35" text-anchor="start">当时 AAL 最弱 → 直接选它</text><rect x="20" y="228" width="560" height="56" rx="12" fill="#f0eee5"/><text x="300.0" y="262.39" font-size="18" fill="#242b29" text-anchor="middle" font-weight="700">不等第二、三名补涨补跌；龙头 ≠ 最大或名气最大</text></svg>
