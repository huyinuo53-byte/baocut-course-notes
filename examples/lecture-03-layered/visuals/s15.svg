<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" role="img"><title>两次空头遇反弹看起来相似结果不同，答案不在K线里，而在事先定好的时间框架和失效条件</title><defs><marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#636c66"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#244e3d"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#974c35"/></marker><marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a4775"/></marker></defs><rect x="20" y="20" width="200" height="90" rx="12" fill="#f0eee5"/><text x="120.0" y="58.92" font-size="19" fill="#242b29" text-anchor="middle" font-weight="700">空头持仓</text><text x="120.0" y="84.57000000000001" font-size="19" fill="#242b29" text-anchor="middle" font-weight="700">遇到强反弹</text><text x="120" y="136" font-size="16" fill="#636c66" text-anchor="middle">当时看起来一样</text><path d="M222 65 C 300 65, 320 20, 400 24 L 560 20" stroke="#974c35" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M222 65 C 300 65, 320 60, 360 40 L 400 90 L 560 120" stroke="#244e3d" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="400" y="18" font-size="16" fill="#974c35" text-anchor="start" font-weight="700">一次：持续上涨</text><text x="400" y="112" font-size="16" fill="#244e3d" text-anchor="start" font-weight="700">另一次：涨两三天又回落</text><rect x="20" y="170" width="560" height="150" rx="12" fill="#e6efe8"/><text x="300.0" y="210.89000000000001" font-size="18" fill="#636c66" text-anchor="middle">事后才知道结果不同</text><text x="300.0" y="235.19000000000003" font-size="18" fill="#242b29" text-anchor="middle">当时该问的是：</text><text x="300.0" y="262.58" font-size="21" fill="#244e3d" text-anchor="middle" font-weight="700">这笔交易的时间框架是什么？</text><text x="300.0" y="290.93" font-size="21" fill="#244e3d" text-anchor="middle" font-weight="700">什么情况才算逻辑失效？</text></svg>
