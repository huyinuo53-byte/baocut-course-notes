<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" role="img"><title>讲师近似个人配置：波段约60%、长期不超过35%、投机5到10%；长期用9个月以上LEAPS，波段用6到9个月期权</title><defs><marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#636c66"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#244e3d"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#974c35"/></marker><marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a4775"/></marker></defs><text x="20" y="32" font-size="20" fill="#242b29" text-anchor="start" font-weight="700">讲师的近似个人配置（不是推荐）</text><rect x="20" y="56" width="330" height="64" rx="6" fill="#f0eee5"/><text x="185" y="96" font-size="20" fill="#242b29" text-anchor="middle" font-weight="700">波段 约 60%</text><rect x="350" y="56" width="192" height="64" rx="0" fill="#e6efe8"/><text x="446" y="96" font-size="20" fill="#244e3d" text-anchor="middle" font-weight="700">长期 ≤ 35%</text><rect x="542" y="56" width="38" height="64" rx="6" fill="#f6e8e1"/><text x="561" y="144" font-size="15" fill="#974c35" text-anchor="middle" font-weight="700">投机</text><text x="561" y="164" font-size="15" fill="#974c35" text-anchor="middle">5–10%</text><rect x="20" y="186" width="270" height="128" rx="12" fill="#e6efe8"/><text x="155.0" y="225.375" font-size="20" fill="#244e3d" text-anchor="middle" font-weight="700">长期</text><text x="155.0" y="248.255" font-size="16" fill="#242b29" text-anchor="middle">持有 3 个月以上</text><text x="155.0" y="269.855" font-size="16" fill="#242b29" text-anchor="middle">LEAPS 9 个月以上</text><text x="155.0" y="290.425" font-size="15" fill="#242b29" text-anchor="middle">约 &gt;10% 虚值 · 单腿只做多</text><rect x="310" y="186" width="270" height="128" rx="12" fill="#f0eee5"/><text x="445.0" y="225.375" font-size="20" fill="#242b29" text-anchor="middle" font-weight="700">波段</text><text x="445.0" y="248.255" font-size="16" fill="#242b29" text-anchor="middle">单腿 · 6–9 个月到期</text><text x="445.0" y="269.855" font-size="16" fill="#242b29" text-anchor="middle">最接近实值的虚值期权</text><text x="445.0" y="290.425" font-size="15" fill="#974c35" text-anchor="middle">优先低 β 标的</text></svg>
