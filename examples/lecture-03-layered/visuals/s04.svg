<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" role="img"><title>z-score 以标准差衡量偏离，ATR 以价格衡量波幅并用作止损尺度，两者单位不同</title><defs><marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#636c66"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#244e3d"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#974c35"/></marker><marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a4775"/></marker></defs><text x="20" y="34" font-size="22" fill="#242b29" text-anchor="start" font-weight="700">两把尺子，单位不同</text><rect x="20" y="56" width="270" height="190" rx="12" fill="#e6efe8"/><text x="155.0" y="112.27000000000001" font-size="24" fill="#244e3d" text-anchor="middle" font-weight="700">z-score</text><text x="155.0" y="138.49" font-size="18" fill="#242b29" text-anchor="middle">单位：标准差 σ</text><text x="155.0" y="162.79000000000002" font-size="18" fill="#242b29" text-anchor="middle">当前价离均值几个 σ</text><text x="155.0" y="186.06" font-size="17" fill="#244e3d" text-anchor="middle">做多盼负向极值</text><text x="155.0" y="209.01" font-size="17" fill="#974c35" text-anchor="middle">做空偏好正向大偏离</text><rect x="310" y="56" width="270" height="190" rx="12" fill="#f0eee5"/><text x="445.0" y="112.27000000000001" font-size="24" fill="#242b29" text-anchor="middle" font-weight="700">ATR</text><text x="445.0" y="138.49" font-size="18" fill="#242b29" text-anchor="middle">单位：价格</text><text x="445.0" y="162.79000000000002" font-size="18" fill="#242b29" text-anchor="middle">真实波幅的平滑</text><text x="445.0" y="186.06" font-size="17" fill="#242b29" text-anchor="middle">本课用作止损尺度</text><text x="445.0" y="209.01" font-size="17" fill="#5a4775" text-anchor="middle">只量波动，不指方向</text><rect x="20" y="262" width="560" height="54" rx="12" fill="#f6e8e1"/><text x="300.0" y="295.39000000000004" font-size="18" fill="#974c35" text-anchor="middle" font-weight="700">不能混用；本课也没给统一的 ATR 止损倍数</text></svg>
