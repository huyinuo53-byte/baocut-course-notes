l="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M30 255 C 120 255, 230 260, 330 258" stroke="#242b29" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="104" cy="257" r="7" fill="#244e3d"/><circle cx="283" cy="258" r="7" fill="#974c35"/><text x="20" y="334" font-size="16" fill="#244e3d" text-anchor="start" font-weight="700">金叉：短线上穿长线</text><text x="190" y="334" font-size="16" fill="#974c35" text-anchor="start" font-weight="700">死叉：短线下穿</text><text x="370" y="176" font-size="20" fill="#242b29" text-anchor="start" font-weight="700">用法二：支撑与阻力</text><rect x="370" y="196" width="210" height="116" rx="12" fill="#fffdf8" stroke="#dcded4" stroke-width="2"/><text x="475.0" y="236.09000000000003" font-size="18" fill="#242b29" text-anchor="middle">价格站上/跌破</text><text x="475.0" y="260.39000000000004" font-size="18" fill="#242b29" text-anchor="middle">MA200 被看作</text><text x="475.0" y="284.69000000000005" font-size="18" fill="#242b29" text-anchor="middle" font-weight="700">多空偏好的分界</text><text x="370" y="334" font-size="15" fill="#636c66" text-anchor="start">交叉本身不保证行情延续</text></svg>
