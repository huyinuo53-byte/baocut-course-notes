<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" role="img"><title>只看两种图形：矩形突破要至少约一年箱体并同时突破MA200；V形急变往往回踩，等回踩而不追第一下</title><defs><marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#636c66"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#244e3d"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#974c35"/></marker><marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a4775"/></marker></defs><text x="150" y="32" font-size="22" fill="#244e3d" text-anchor="middle" font-weight="700">矩形突破</text><text x="450" y="32" font-size="22" fill="#974c35" text-anchor="middle" font-weight="700">V 形急变</text><rect x="40" y="90" width="180" height="90" rx="4" fill="#e6efe8"/><path d="M40 170 L70 110 L100 165 L130 105 L160 168 L190 108 L220 150 L250 70 L280 55" stroke="#244e3d" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M30 120 C 120 128, 200 118, 290 112" stroke="#242b29" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/><text x="236" y="140" font-size="14" fill="#242b29" text-anchor="start">MA200</text><text x="130" y="205" font-size="16" fill="#636c66" text-anchor="middle">箱体 ≥ 约一年</text><path d="M330 70 L400 180 L430 85 L450 130 L480 110 L560 60" stroke="#974c35" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="450" cy="130" r="8" fill="none" stroke="#974c35" stroke-width="3"/><text x="462" y="160" font-size="16" fill="#974c35" text-anchor="start" font-weight="700">回踩</text><rect x="20" y="228" width="260" height="116" rx="12" fill="#e6efe8"/><text x="150.0" y="271.11" font-size="17" fill="#242b29" text-anchor="middle" font-weight="700">上沿突破＋同时站上 MA200</text><text x="150.0" y="293.03000000000003" font-size="16" fill="#242b29" text-anchor="middle">讲师认为假突破较少</text><text x="150.0" y="313.6" font-size="15" fill="#636c66" text-anchor="middle">（个人经验）</text><rect x="320" y="228" width="260" height="116" rx="12" fill="#f6e8e1"/><text x="450.0" y="271.11" font-size="17" fill="#242b29" text-anchor="middle" font-weight="700">急变后往往还会回踩</text><text x="450.0" y="293.03000000000003" font-size="16" fill="#242b29" text-anchor="middle">不追第一下，等回踩</text><text x="450.0" y="313.6" font-size="15" fill="#636c66" text-anchor="middle">期权持仓通常规避</text></svg>
