<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" role="img"><title>长期篮子与波段篮子事先隔离；做空不放入长期篮子；合约到期时间不等于实际持有期</title><defs><marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#636c66"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#244e3d"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#974c35"/></marker><marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a4775"/></marker></defs><rect x="20" y="20" width="270" height="190" rx="12" fill="#e6efe8"/><text x="155.0" y="87.39" font-size="23" fill="#244e3d" text-anchor="middle" font-weight="700">长期篮子</text><text x="155.0" y="113.28999999999999" font-size="18" fill="#242b29" text-anchor="middle">偏困境反转</text><text x="155.0" y="137.59" font-size="18" fill="#242b29" text-anchor="middle">期权约 12 个月以上</text><text x="155.0" y="160.86" font-size="17" fill="#974c35" text-anchor="middle" font-weight="700">不放空头</text><rect x="310" y="20" width="270" height="190" rx="12" fill="#f0eee5"/><text x="445.0" y="87.39" font-size="23" fill="#242b29" text-anchor="middle" font-weight="700">波段篮子</text><text x="445.0" y="113.28999999999999" font-size="18" fill="#242b29" text-anchor="middle">趋势跟随</text><text x="445.0" y="136.56" font-size="17" fill="#242b29" text-anchor="middle">＋仓位扭曲后的均值回归</text><text x="445.0" y="160.54000000000002" font-size="18" fill="#242b29" text-anchor="middle">期权约 6–9 个月</text><rect x="20" y="226" width="560" height="88" rx="12" fill="#f6e8e1"/><text x="300.0" y="266.3" font-size="20" fill="#974c35" text-anchor="middle" font-weight="700">合约到期 ≠ 实际持有期</text><text x="300.0" y="289.18" font-size="16" fill="#242b29" text-anchor="middle">先分篮子，减少临场冲突；远期合约也不会自动带来纪律</text></svg>
