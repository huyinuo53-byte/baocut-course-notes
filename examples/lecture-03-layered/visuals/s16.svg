<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" role="img"><title>时间框架：短线日内到约一周、波段1到8周、长线三个月以上；先定期限再配策略和仓位</title><defs><marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#636c66"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#244e3d"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#974c35"/></marker><marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a4775"/></marker></defs><text x="20" y="32" font-size="22" fill="#242b29" text-anchor="start" font-weight="700">每笔交易先回答：拿多久？</text><path d="M30 110 H570" stroke="#636c66" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M30 100 V120" stroke="#636c66" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="146" font-size="15" fill="#636c66" text-anchor="middle">日内</text><path d="M130 100 V120" stroke="#636c66" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="130" y="146" font-size="15" fill="#636c66" text-anchor="middle">1 周</text><path d="M330 100 V120" stroke="#636c66" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="330" y="146" font-size="15" fill="#636c66" text-anchor="middle">8 周</text><path d="M420 100 V120" stroke="#636c66" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="420" y="146" font-size="15" fill="#636c66" text-anchor="middle">3 个月</text><path d="M570 100 V120" stroke="#636c66" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="570" y="146" font-size="15" fill="#636c66" text-anchor="middle">更久</text><rect x="30" y="60" width="100" height="34" rx="6" fill="#f0eee5"/><text x="80" y="83" font-size="17" fill="#242b29" text-anchor="middle" font-weight="700">短线</text><rect x="130" y="60" width="200" height="34" rx="6" fill="#e6efe8"/><text x="230" y="83" font-size="17" fill="#244e3d" text-anchor="middle" font-weight="700">波段 1–8 周</text><rect x="330" y="60" width="90" height="34" rx="6" fill="#ffffff" stroke="#dcded4" stroke-width="2" stroke-dasharray="6 5"/><text x="375" y="83" font-size="13" fill="#636c66" text-anchor="middle">未严格分界</text><rect x="420" y="60" width="150" height="34" rx="6" fill="#e6efe8"/><text x="495" y="83" font-size="17" fill="#244e3d" text-anchor="middle" font-weight="700">长线 3 月+</text><rect x="20" y="176" width="560" height="104" rx="12" fill="#f0eee5"/><text x="300.0" y="212.115" font-size="18" fill="#242b29" text-anchor="middle" font-weight="700">先定期限，再配策略、标的、止盈止损和仓位</text><text x="300.0" y="235.385" font-size="17" fill="#242b29" text-anchor="middle">讲师倾向非专职者做波段和长线</text><text x="300.0" y="257.305" font-size="16" fill="#974c35" text-anchor="middle">时间框架是管理规则，不是永久持有的借口</text></svg>
