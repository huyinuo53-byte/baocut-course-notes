<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" role="img"><title>困境反转先看两道筛选：股价自52周高点至少跌一半，且估值倍数处于5到20年历史低位</title><defs><marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#636c66"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#244e3d"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#974c35"/></marker><marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a4775"/></marker></defs><text x="20" y="32" font-size="22" fill="#242b29" text-anchor="start" font-weight="700">两道不同的筛选</text><rect x="20" y="52" width="270" height="170" rx="12" fill="#f6e8e1"/><text x="155.0" y="107.685" font-size="22" fill="#974c35" text-anchor="middle" font-weight="700">股价跌幅</text><text x="155.0" y="133.26500000000001" font-size="18" fill="#242b29" text-anchor="middle">自 52 周高点</text><text x="155.0" y="161.68500000000003" font-size="22" fill="#974c35" text-anchor="middle" font-weight="700">至少跌一半</text><text x="155.0" y="184.175" font-size="15" fill="#636c66" text-anchor="middle">单位：价格</text><rect x="310" y="52" width="270" height="170" rx="12" fill="#e6efe8"/><text x="445.0" y="107.685" font-size="22" fill="#244e3d" text-anchor="middle" font-weight="700">估值倍数</text><text x="445.0" y="133.26500000000001" font-size="18" fill="#242b29" text-anchor="middle">5–10 年甚至 20 年</text><text x="445.0" y="161.68500000000003" font-size="22" fill="#244e3d" text-anchor="middle" font-weight="700">历史低位区</text><text x="445.0" y="184.175" font-size="15" fill="#636c66" text-anchor="middle">如 EV/EBITDA（NTM）</text><text x="300" y="142" font-size="30" fill="#242b29" text-anchor="middle" font-weight="700">＋</text><rect x="20" y="238" width="560" height="64" rx="12" fill="#f0eee5"/><text x="300.0" y="276.39000000000004" font-size="18" fill="#242b29" text-anchor="middle" font-weight="700">长期比较看估值倍数，不比较二十年前的股价</text></svg>
