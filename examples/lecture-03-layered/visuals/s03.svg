<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" role="img"><title>RSI 标尺：低于20可能短线反弹，高于80可能回落；常见阈值为30/70；极值不等于反转</title><defs><marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#636c66"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#244e3d"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#974c35"/></marker><marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a4775"/></marker></defs><text x="20" y="34" font-size="20" fill="#242b29" text-anchor="start" font-weight="700">RSI：看动量是否到了极值</text><rect x="30" y="70" width="108.0" height="50" rx="6" fill="#e6efe8"/><rect x="138.0" y="70" width="324.0" height="50" rx="0" fill="#f0eee5"/><rect x="462.0" y="70" width="108.0" height="50" rx="6" fill="#f6e8e1"/><text x="30.0" y="145" font-size="17" fill="#242b29" text-anchor="middle">0</text><text x="138.0" y="145" font-size="17" fill="#242b29" text-anchor="middle" font-weight="700">20</text><text x="192.0" y="145" font-size="17" fill="#5a4775" text-anchor="middle">30</text><text x="408.0" y="145" font-size="17" fill="#5a4775" text-anchor="middle">70</text><text x="462.0" y="145" font-size="17" fill="#242b29" text-anchor="middle" font-weight="700">80</text><text x="570.0" y="145" font-size="17" fill="#242b29" text-anchor="middle">100</text><path d="M192.0 64 V126" stroke="#5a4775" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/><path d="M408.0 64 V126" stroke="#5a4775" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/><text x="84.0" y="101" font-size="18" fill="#244e3d" text-anchor="middle" font-weight="700">&lt;20</text><text x="516.0" y="101" font-size="18" fill="#974c35" text-anchor="middle" font-weight="700">&gt;80</text><rect x="20" y="170" width="270" height="84" rx="12" fill="#e6efe8"/><text x="155.0" y="206.595" font-size="19" fill="#244e3d" text-anchor="middle" font-weight="700">低于 20</text><text x="155.0" y="231.21500000000003" font-size="18" fill="#242b29" text-anchor="middle">可能短线反弹</text><rect x="310" y="170" width="270" height="84" rx="12" fill="#f6e8e1"/><text x="445.0" y="197.14499999999998" font-size="19" fill="#974c35" text-anchor="middle" font-weight="700">高于 80</text><text x="445.0" y="219.70499999999998" font-size="16" fill="#242b29" text-anchor="middle">可能回落；若基本面已支持</text><text x="445.0" y="241.30499999999998" font-size="16" fill="#242b29" text-anchor="middle">做空，增强建仓信心</text><text x="20" y="284" font-size="16" fill="#242b29" text-anchor="start">周期：RSI14 波段（偏好） · RSI7 更敏感偏短线 · RSI2 已不用</text><text x="20" y="312" font-size="16" fill="#5a4775" text-anchor="start">虚线 30/70 = 外部资料的常见阈值；20/80 是讲师自选</text><text x="20" y="338" font-size="16" fill="#974c35" text-anchor="start" font-weight="700">极值 ≠ 反转已经发生</text></svg>
