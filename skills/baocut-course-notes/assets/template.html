<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{TITLE}}</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f0e7;color:#28251f;font:18px/1.9 'Songti SC',Georgia,serif}header,main{max-width:980px;margin:auto;padding:32px 24px}header{border-bottom:3px solid #665044}h1{font-size:clamp(32px,6vw,60px);line-height:1.2}h2{line-height:1.4;font-size:28px}h3{font-size:19px;color:#695749}small,figcaption{color:#756c60;font-size:14px}nav{display:flex;gap:14px;flex-wrap:wrap}a{color:#4c6658}section{padding:28px 0;border-bottom:1px solid #d7cdbb;scroll-margin-top:15px}p,h1,h2,h3,a,small,figcaption{overflow-wrap:anywhere}nav>a{max-width:100%;min-width:0}figure{margin:28px 0}.zoom{display:block;padding:0;border:0;width:100%;background:white;cursor:zoom-in}.zoom img{display:block;width:100%;height:auto}aside{background:#e9e3d7;padding:18px;border-radius:8px}dialog{width:95vw;max-width:1500px;max-height:95vh;overflow:auto;border:0;padding:20px}dialog::backdrop{background:#000b}dialog img{width:100%;height:auto}dialog button{padding:10px 20px;cursor:pointer}@media(max-width:600px){body{font-size:17px}header,main{padding:24px 18px}}@media print{nav,dialog{display:none}body{background:white}figure{break-inside:avoid}h2,h3{break-after:avoid}}
.image-viewport{overflow:auto;max-height:78vh;overscroll-behavior:contain}.image-viewport img{display:block}.image-viewport.actual img{width:auto;max-width:none;max-height:none}.zoom-hint{display:block;margin:8px 0}dialog button{margin-right:8px}
</style></head><body><header><small>课堂笔记 · {{META}}</small><h1>{{TITLE}}</h1><p>{{SOURCE}}</p><nav>{{TOC}}</nav></header><main><aside>{{LIMITS}}</aside>{{BODY}}</main><dialog aria-label="讲义大图"><button id="close">关闭</button><button id="actual-size" aria-pressed="false">原尺寸</button><small class="zoom-hint">原尺寸下可左右、上下滑动查看细节。</small><div class="image-viewport"><img alt="讲义放大图"></div></dialog><script>
const d=document.querySelector('dialog'),v=d.querySelector('.image-viewport'),size=document.querySelector('#actual-size');
function setActual(actual){v.classList.toggle('actual',actual);size.setAttribute('aria-pressed',String(actual));size.textContent=actual?'适合屏幕':'原尺寸'}
document.querySelectorAll('.zoom').forEach(b=>b.addEventListener('click',()=>{d.querySelector('img').src=b.querySelector('img').src;setActual(matchMedia('(max-width:600px)').matches);d.showModal();v.scrollTo(0,0)}));
size.addEventListener('click',()=>setActual(!v.classList.contains('actual')));
document.querySelector('#close').addEventListener('click',()=>d.close());d.addEventListener('click',e=>{if(e.target===d)d.close()});
</script></body></html>
